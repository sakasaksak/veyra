<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veyra — Product</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-size: 14px;
    }

    .product {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
      align-items: center;
    }

    .product-image img {
      width: 100%;
      max-height: 600px;
      object-fit: cover;
      border-radius: 12px;
    }

    .product-info h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .product-info .category {
      color: #777;
      margin-bottom: 20px;
    }

    .price {
      font-size: 30px;
      font-weight: bold;
      margin: 25px 0;
    }

    .description {
      color: #666;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .affiliate-button {
      display: inline-block;
      background: #111;
      color: white;
      text-decoration: none;
      padding: 15px 28px;
      border-radius: 6px;
      font-size: 16px;
    }

    .affiliate-button:hover {
      opacity: 0.85;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #555;
      text-decoration: none;
    }

    footer {
      margin-top: 70px;
      padding: 30px;
      text-align: center;
      background: #111;
      color: #aaa;
    }

    @media (max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
      }

      .product-info h1 {
        font-size: 34px;
      }

      nav {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">VEYRA</div>

    <nav>
      <a href="index.html">Home</a>
      <a href="categories.html">Categories</a>
      <a href="products.html">Products</a>
    </nav>
  </header>

  <main class="product">

    <div class="product-image">
      <img
        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=80"
        alt="Classic White Sneakers"
      >
    </div>

    <div class="product-info">

      <div class="category">
        Shoes
      </div>

      <h1>Classic White Sneakers</h1>

      <div class="price">
        $49.99
      </div>

      <p class="description">
        A clean and versatile pair of classic white sneakers.
        Discover this product and find the best available offer
        from our partner stores.
      </p>

      <a
        class="affiliate-button"
        href="https://example.com/affiliate/test-001"
        target="_blank"
        rel="nofollow sponsored noopener"
      >
        View Deal
      </a>

      <br>

      <a class="back" href="products.html">
        ← Back to Products
      </a>

    </div>

  </main>

  <footer>
    © 2026 Veyra. Fashion discovery made simple.
  </footer>

</body>
</html>
